plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.evaluacion4charlottegabriel'
    compileSdk 32

    defaultConfig {
        applicationId "com.example.evaluacion4charlottegabriel"
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    sourceSets {
        main {
            assets.srcDirs = ['../assets']
        }
    }
}

def finalIllustrationAssets = [
        'icon_carta_dia.png',
        'icon_si_o_no.png',
        'icon_tarot_parejas.png',
        'icon_coleccion.png',
        'icon_inicio.png',
        'icon_ajustes.png',
        'icon_favoritos.png',
        'icon_escuchar.png',
        'icon_bloqueado.png',
        'bg_watercolor.png',
        'cloud_01.png',
        'cloud_02.png',
        'cloud_03.png',
        'cloud_04.png',
        'cloud_05.png',
        'cloud_06.png',
        'sparkle_01.png',
        'sparkle_02.png',
        'sparkle_03.png',
        'sparkle_04.png',
        'sparkle_05.png',
        'sparkle_06.png',
        'sparkle_07.png',
        'sparkle_08.png',
        'sparkle_09.png',
        'sparkle_10.png',
        'panel_frame_01.png',
        'panel_frame_02.png',
        'panel_frame_03.png',
        'card_back_official.png'
]

tasks.register('syncFinalIllustrationAssets', Copy) {
    from('../assets/Icons_menu') {
        include finalIllustrationAssets
    }
    into('src/main/res/drawable-nodpi')
}

tasks.named('preBuild').configure {
    dependsOn('syncFinalIllustrationAssets')
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.4'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0'
    implementation platform('com.google.firebase:firebase-bom:31.1.1')
    implementation 'com.google.firebase:firebase-database'
}
